quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-wit
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${URL_DB}
%prod.quarkus.datasource.username=${USERNAME_DB}
%prod.quarkus.datasource.password=${PASSWORD_DB}
